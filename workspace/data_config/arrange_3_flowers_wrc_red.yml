# Raw x2robot collection paths for arrange_3_flowers_wrc_red
# Task: arrange 3 flowers (red-rose related instructions)
#
# Matching conversion config:
#   workspace/data_config/arrange_3_flowers_wrc_red_x2robot2lerobot.json
# Conversion command (from the wall-x repository root):
#   # Requires lerobot==0.4.4 (Python 3.10 + CODEBASE_VERSION v3.0)
#   python x2robot2lerobot.py --config workspace/data_config/arrange_3_flowers_wrc_red_x2robot2lerobot.json
#
# Output directory is output_path in the JSON (default <path/to/data>/arrange_3_flowers_wrc_red_lerobot)
# Copy the JSON and fill in src_path_list and output_path before use.

dataset_path:
  - path: <path/to/x2robot_data>/collection_day_example
  - path: <path/to/x2robot_data>/collection_night_example
