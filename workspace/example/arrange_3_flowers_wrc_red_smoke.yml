# Smoke config: 2 optimizer steps to validate the flowers training pipeline.
# Uses 256px to fit shared GPUs; production config uses 448.
# Derived from arrange_3_flowers_wrc_red.yml

model_type: qwen2_5

task:
  # 20 (arms) + 6 (padding) = 26; no velocity / height / head.
  dof_config:
    follow_left_ee_cartesian_pos_relative: 3
    follow_left_ee_rotation_6D_relative: 6
    follow_left_gripper: 1
    follow_right_ee_cartesian_pos_relative: 3
    follow_right_ee_rotation_6D_relative: 6
    follow_right_gripper: 1
    action_padding: 6
  ar_dof_config:
    follow_left_ee_cartesian_pos_relative: 3
    follow_left_ee_rotation_6D_relative: 6
    follow_left_gripper: 1
    follow_right_ee_cartesian_pos_relative: 3
    follow_right_ee_rotation_6D_relative: 6
    follow_right_gripper: 1
    action_padding: 6
  agent_pos_config:
    follow_left_ee_cartesian_pos: 3
    follow_left_ee_rotation_6D: 6
    follow_left_gripper: 1
    follow_right_ee_cartesian_pos: 3
    follow_right_ee_rotation_6D: 6
    follow_right_gripper: 1
    action_padding: 6
  action_horizon: 32
  action_horizon_flow: 32
  use_state_string_representation: false

model:
  backbone: qwen2_5
  config_path: <path/to/wall-oss-0.5>/config.json
  processor_path: <path/to/Qwen2.5-VL-3B-Instruct>
  pretrained_path: <path/to/Qwen2.5-VL-3B-Instruct>
  attn_deterministic: true
  use_ema: false
  flow_loss_weight: 1.0
  ar_loss_weight: 0.01

hyperparams:
  num_epoch: 1
  batch_size_per_gpu: 1
  gradient_accumulation_steps: 1
  seed: 10222
  optimizer:
    optimizer_type: adamw
    learning_rate: 5.0e-05
    max_grad_norm: 1.0
    enable_grad_clip: true
    betas: [0.9, 0.95]
    weight_decay: 1.0e-8
    eps: 1.0e-8
  scheduler:
    scheduler_type: cosine
    num_warmup_steps: 0
    num_training_steps: 2
    min_lr: 1.0e-6

distributed:
  use_fsdp: true
  use_mixed_precision: true
  bf16: true

data:
  dataset_type: lerobot
  lerobot_config:
    repo_id: <path/to/data>/arrange_3_flowers_wrc_red_lerobot
    root: null
  key_mappings:
    camera:
      observation.images.faceImg: face_view
      observation.images.leftImg: left_wrist_view
      observation.images.rightImg: right_wrist_view
    state: observation.state
    action: action
  norm_stats_path: <path/to/data>/arrange_3_flowers_wrc_red_norm_stats.json
  train_test_split: 0.95
  num_workers: 0
  max_length: 1024
  resolution:
    face_view: 256
    left_wrist_view: 256
    right_wrist_view: 256

logging:
  log_name: arrange_3_flowers_smoke
  log_project: wall_oss_flowers
  log_entity: ""
  use_wandb: false
  log_interval: 1
  save_interval: 1000000
  val_interval: 1000000
  epoch_save_interval: 100

checkpoint:
  save_path: <path/to/ckpt>/arrange_3_flowers_wrc_red_smoke
  resume_from: <path/to/wall-oss-0.5>/model.safetensors

debug:
  profile: false
  nvtx: false
